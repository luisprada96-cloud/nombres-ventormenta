<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111626">
  <meta name="description" content="Combina nombres de humanas de WoW Classic con apellidos nobles de Ventormenta y encuentra el nombre de tu maga.">
  <title>Tu nombre en Ventormenta</title>
  <style>
    :root{color-scheme:dark;--bg:#111626;--panel:#1b2237;--ink:#f3eee5;--muted:#b2b8ca;--gold:#e8c989;--line:#39415a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:36px 20px;background:radial-gradient(ellipse at 50% 0%,#343353 0%,transparent 58%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:100%;max-width:620px}
    header{text-align:center;margin-bottom:30px}
    .sigil{display:inline-grid;place-items:center;width:42px;height:42px;border:1px solid #e8c98955;border-radius:50%;font-size:24px;color:var(--gold);margin-bottom:15px}
    .eyebrow{margin:0 0 12px;text-transform:uppercase;letter-spacing:.22em;font-size:11px;font-weight:650;color:var(--gold)}
    h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(30px,6vw,43px);line-height:1.12;letter-spacing:-.03em;margin:0 0 14px}
    .intro{margin:0 auto;max-width:400px;font-size:14px;line-height:1.65;color:var(--muted)}
    .card{padding:30px;border:1px solid #8187ae33;border-radius:20px;background:linear-gradient(135deg,#ffffff05,transparent),var(--panel);box-shadow:0 20px 70px #0003}
    .result{min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px 0 28px;border-bottom:1px solid var(--line);margin-bottom:27px}
    .result-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.2em;margin:0 0 14px}
    output{font-family:Georgia,"Times New Roman",serif;font-size:clamp(27px,6.4vw,39px);line-height:1.2;color:var(--gold);overflow-wrap:anywhere}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    label{display:block;font-size:13px;font-weight:600;margin-bottom:9px}
    select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:#11182a;border:1px solid #49516c;border-radius:10px;padding:13px 34px 13px 13px;cursor:pointer;min-height:49px}
    select:hover{border-color:#939bc0}
    button{font:inherit;cursor:pointer;border-radius:10px;min-height:48px;font-weight:650;transition:background .15s,transform .15s}
    button:active{transform:translateY(1px)}
    button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #b7a1ef;outline-offset:4px}
    .actions{display:flex;gap:12px;margin-top:23px}
    #random{flex:1;background:var(--gold);border:1px solid var(--gold);color:#252033;padding:13px 16px}
    #random:hover{background:#f7dba6}
    #copy{background:transparent;border:1px solid #59617e;color:var(--ink);padding:13px 18px}
    #copy:hover{background:#ffffff0a}
    .note{font-size:12px;line-height:1.5;min-height:18px;text-align:center;color:var(--muted);margin:18px 0 0}
    footer{margin-top:24px;text-align:center;color:#a3aac0;font-size:11px;line-height:1.8}
    footer p{margin:3px 0}a{color:inherit;text-underline-offset:3px}a:hover{color:var(--gold)}
    @media(max-width:420px){body{padding:28px 16px}.card{padding:23px 20px}.fields{grid-template-columns:1fr;gap:17px}.result{min-height:128px}.actions{gap:9px}#copy{padding-inline:14px}}
    @media(prefers-reduced-motion:reduce){button{transition:none}}
  </style>
</head>
<body>
  <main>
    <header>
      <span class="sigil" aria-hidden="true">✧</span>
      <p class="eyebrow">Humanas · WoW Classic</p>
      <h1>Tu nombre en Ventormenta</h1>
      <p class="intro">Un nombre, un linaje y un poco de magia.<br>Encuentra la combinación para tu maga.</p>
    </header>
    <section class="card" aria-label="Generador de nombres">
      <div class="result">
        <p class="result-label" id="result-label">Tu próxima maga</p>
        <output id="full-name" for="first-name surname" aria-labelledby="result-label" aria-live="polite" aria-atomic="true">Jennea Ellerian</output>
      </div>
      <div class="fields">
        <div><label for="first-name">Nombre</label><select id="first-name"></select></div>
        <div><label for="surname">Apellido</label><select id="surname"></select></div>
      </div>
      <div class="actions">
        <button id="random" type="button"><span aria-hidden="true">✦ &nbsp;</span>Combinación aleatoria</button>
        <button id="copy" type="button" aria-label="Copiar nombre completo">Copiar</button>
      </div>
      <p class="note" id="status" role="status"></p>
      <noscript><p>Activa JavaScript para usar los selectores y generar combinaciones.</p></noscript>
    </section>
    <footer>
      <p id="count">23 nombres · 30 apellidos · 690 combinaciones</p>
      <p>Apellidos de <a href="https://warcraft.wiki.gg/wiki/Nobles_of_Stormwind" target="_blank" rel="noopener noreferrer">Nobles of Stormwind · Warcraft Wiki</a></p>
    </footer>
  </main>
  <script>
    const names = ['Tiffin','Jennea','Laurena','Anetta','Katherine','Ursula','Jessara','Shaina','Maris','Catherine','Olivia','Rebecca','Katie','Milly','Maybell','Sara','Jaina','Aegwynn','Althea','Sally','Brigitte','Darcy','Pamela'];
    const surnames = ['Wrynn','Ellerian','Clessington','Ebonlocke','Flintridge','Erlgadin','Lescovar','Ridgewell','Tremaind','Vanyst','Whipple','Lothar','Prestor','Fordragon','Stoutmantle','Freeman','Dreuger','Valdread','Millstipe','Wishock',"Von'Indi",'Ference','Kennedy','Ulnur','Shadowbreaker','Berrybuck','Daris','Romano','Khort','Kremen'];
    const first = document.getElementById('first-name');
    const surname = document.getElementById('surname');
    const result = document.getElementById('full-name');
    const status = document.getElementById('status');
    const copy = document.getElementById('copy');
    function populate(select, values) {
      for (const value of [...values].sort((a,b) => a.localeCompare(b, 'es'))) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value === 'Whipple' ? 'Whipple (beta)' : value;
        select.append(option);
      }
    }
    populate(first, names);
    populate(surname, surnames);
    first.value = 'Jennea';
    surname.value = 'Ellerian';
    let copyTimer;
    function update() {
      clearTimeout(copyTimer);
      result.textContent = `${first.value} ${surname.value}`;
      copy.textContent = 'Copiar';
      status.textContent = surname.value === 'Whipple' ? 'La familia Whipple solo apareció en la beta.' : 'Elige los dos o deja que decida el destino.';
    }
    first.addEventListener('change', update);
    surname.addEventListener('change', update);
    document.getElementById('random').addEventListener('click', () => {
      let index = Math.floor(Math.random() * (names.length * surnames.length - 1));
      const previousIndex = names.indexOf(first.value) * surnames.length + surnames.indexOf(surname.value);
      if (index >= previousIndex) index++;
      first.value = names[Math.floor(index / surnames.length)];
      surname.value = surnames[index % surnames.length];
      update();
    });
    copy.addEventListener('click', async () => {
      const name = result.textContent;
      try {
        if (!navigator.clipboard || !window.isSecureContext) throw new Error('Clipboard unavailable');
        await navigator.clipboard.writeText(name);
        if (result.textContent !== name) return;
        copy.textContent = '¡Copiado!';
        status.textContent = `${name} copiado al portapapeles.`;
        clearTimeout(copyTimer);
        copyTimer = setTimeout(update, 2500);
      } catch {
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(result);
        selection.removeAllRanges();
        selection.addRange(range);
        status.textContent = 'Nombre seleccionado. Usa el menú Copiar de tu dispositivo.';
      }
    });
    update();
  </script>
</body>
</html>
